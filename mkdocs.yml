site_name: dacli
site_description: Context management for hierarchies of coding agents.
site_url: https://www.tahabouhsine.com/dacli/
repo_name: mlnomadpy/dacli
repo_url: https://github.com/mlnomadpy/dacli
edit_uri: edit/main/docs/
docs_dir: docs
exclude_docs: |
  README.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Start here:
      - Operator playbook: OPERATOR_PLAYBOOK.md
      - Walkthrough: WALKTHROUGH.md
  - Design & format:
      - Architecture: ARCHITECTURE.md
      - Diagrams: DIAGRAMS.md
      - Format: FORMAT.md
      - Compatibility: COMPATIBILITY.md
      - Trust & mutation boundaries: TRUST.md
      - Performance: PERFORMANCE.md
      - SPM: SPM.md
  - Teams & runtimes:
      - Team: TEAM.md
      - Shortcuts: SHORTCUTS.md
      - Runtimes: RUNTIMES.md
      - Multi-CLI operations: MULTI_CLI.md
      - Skills: SKILLS.md
      - MCP: MCP.md
      - Prompts: PROMPTS.md
      - Templates: TEMPLATES.md
  - GitHub:
      - Integration and landing: GITHUB.md
      - GitHub App boundary: GITHUB_APP.md
  - Dogfooding:
      - Dogfood as proof: DOGFOOD.md
      - dacli builds dacli: SELFHOSTING.md
  - Reference:
      - Roster: ROSTER.md
      - Proposals: PROPOSALS.md
      - Review: REVIEW.md
  - Research:
      - Cross-project evidence: research/CROSS_PROJECT_EVIDENCE.md
      - Interview guide: research/INTERVIEW_GUIDE.md
      - Dashboard UX synthesis: research/DASHBOARD_UX_RESEARCH.md
      - Operator interview: research/interviews/operator.md
      - Adopter interview: research/interviews/adopter.md
      - Implementer-agent interview: research/interviews/implementer-agent.md
      - Reviewer-agent interview: research/interviews/reviewer-agent.md

extra_css:
  - stylesheets/landing.css
