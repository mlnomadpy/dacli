name: docs
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "internal/features/dashboard/ui/evidence.html"
      - "internal/features/dashboard/ui/package-lock.json"
      - "internal/features/dashboard/ui/package.json"
      - "internal/features/dashboard/ui/src/**"
      - "internal/features/dashboard/ui/vite.evidence.config.ts"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/features/dashboard/ui/package-lock.json
      - name: Install mkdocs-material
        run: pip install mkdocs-material
      - name: Build representative dashboard evidence
        working-directory: internal/features/dashboard/ui
        run: |
          npm ci
          npm run build:evidence
      - name: Build site
        run: |
          mkdocs build
          mkdir -p site/dashboard-evidence
          cp internal/features/dashboard/ui/evidence-dist/evidence.html site/dashboard-evidence/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
