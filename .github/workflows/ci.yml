name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Manual re-trigger for a branch whose pull_request event silently didn't fire
  # (dacli 263): `gh workflow run ci.yml --ref <branch>` forces a run against the
  # head SHA instead of hand-merging main to manufacture a synchronize event.
  workflow_dispatch:

jobs:
  test-matrix:
    # BOTH platforms, because a one-runner suite cannot tell "passes" from
    # "passes on Linux". dacli's process management is where that distinction
    # bites: procmon shells out to `ps -o lstart=` for the PID-identity
    # fingerprint, uses Setpgid/Kill for process groups, and reaps zombies —
    # all of which behave differently on Darwin and Linux, and none of which a
    # single ubuntu leg can vouch for (issue #437 items 2 and 3).
    #
    # fail-fast is off so a macOS-only failure still reports the Linux result
    # rather than cancelling it: "which platform" is the first question.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runs the suite on the module's FLOOR, so "targets 1.22" is a
          # claim something actually executes rather than only compiles.
          - os: ubuntu-latest
            go: "1.22"
          # macOS needs a newer toolchain, and the reason is the runner's OS,
          # not this code. Go 1.22's linker does not emit an LC_UUID load
          # command, and current macOS dyld refuses such a binary:
          #
          #   dyld[3606]: missing LC_UUID load command in …/cli.test
          #   signal: abort trap
          #
          # Two packages died that way on the macos leg's first run while every
          # ubuntu package passed — which is precisely the platform split this
          # matrix was added to surface (issue #437 item 2). The 1.22 floor is
          # unchanged and still proven: by the ubuntu leg above, and by
          # cross-compile and clean-checkout below, which both build on it.
          - os: macos-latest
            go: "1.25"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      # Build the dashboard SPA first: `go:embed all:ui/dist` (internal/features/
      # dashboard) embeds internal/features/dashboard/ui/dist/index.html, so the
      # frontend must be built before any go build/test/vet reads it, or the
      # binary would ship the legacy fallback page instead of the current SPA.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/features/dashboard/ui/package-lock.json
      - name: build frontend
        working-directory: internal/features/dashboard/ui
        run: |
          npm ci
          npm run build
      - name: test frontend
        working-directory: internal/features/dashboard/ui
        run: npm run test:unit
      - name: lint frontend
        working-directory: internal/features/dashboard/ui
        run: npm run lint
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: CI workflow contract
        run: go test ./.github/workflows
      - name: deterministic release-readiness scenarios
        run: go test -v ./internal/scenarios
      # The curated static-analysis gate. Its linter set and every deliberate
      # omission are argued in .golangci.yml itself, so a reviewer can see why
      # a check is or is not running without archaeology. Pinned to a version:
      # a floating "latest" turns an unrelated PR red the day upstream adds a
      # check, which is how teams learn to ignore the lint job.
      # -race and a coverage floor, because dacli's own `tdd` gate template
      # requires both of any project it governs and required neither of itself.
      #
      # Scope note, now with the gap closed. The race detector instruments
      # GOROUTINES within one process; dacli's sharpest concurrency risk is
      # CROSS-process — parallel agents read-modify-writing the same markdown
      # through separate dacli invocations — which -race cannot observe by
      # construction.
      #
      # That gap is covered by TestConcurrentProcesses* (internal/cli), which
      # runs several REAL binaries against one workspace and asserts the
      # invariants the file locks exist to hold: every task gets a distinct
      # seq, and no task or note is lost. Removing the seq lock makes it fail
      # with "seq 001 was handed out twice" — task 209's exact symptom — so it
      # measures the locking rather than the happy path (dacli 359).
      #
      # -race is still worth running: it is the cheapest guard available and it
      # covers the in-process supervisor paths.
      - name: test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...
      # Global AND per-package floors. One aggregate hides the failure that
      # matters: internal/gates could fall from 21.7% to zero and the total
      # would barely move, while the thing that fell is the surface deciding
      # whether a stage may advance. The script names WHICH package fell and by
      # how much (dacli 357).
      - name: coverage floors
        run: ./scripts/coverage-floor.sh coverage.out
      - name: process suites (repeated, race)
        run: |
          go test -race -count=5 ./internal/procmon/
          go test -race -count=5 ./internal/features/execution/ \
            -run 'TestExecRuntimeDetached|TestAlive|TestKillTree|TestRecordRoundTrip'
      # A BOUNDED fuzz run, on the ubuntu leg only. `go test ./...` already
      # replays each target's seed corpus, but seeds only cover the inputs
      # someone thought of — and this repo's flag parser had two real defects
      # that no seed caught and the fuzzer found in six seconds (dacli 350).
      #
      # 20s per target keeps CI honest without turning it into a fuzzing farm:
      # enough to catch a crasher introduced by the change under review, and a
      # regression corpus entry (testdata/fuzz) makes any past finding
      # permanent regardless of this budget.
      - name: fuzz (bounded)
        if: matrix.os == 'ubuntu-latest'
        run: |
          for t in FuzzParseFlags FuzzValueSpellingsAgree; do
            go test ./internal/clikit/ -run '^$' -fuzz "$t" -fuzztime 20s
          done
          for t in FuzzFrontMatterRoundTrip FuzzParseNeverPanics; do
            go test ./internal/mdstore/ -run '^$' -fuzz "$t" -fuzztime 20s
          done
          # The path guards between a user-supplied ref and the filesystem.
          for t in FuzzSafeSegmentNeverEscapes FuzzSafeRelPathNeverEscapes; do
            go test ./internal/workspace/ -run '^$' -fuzz "$t" -fuzztime 20s
          done
      - name: build
        run: go build ./cmd/dacli
      # Share this one build with cross-compile below instead of every matrix
      # leg running its own npm ci + npm run build.
      # Uploaded from ONE leg only: both legs build an identical dist, and two
      # uploads under the same name collide. The lint and cross-compile jobs
      # consume it.
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: dashboard-ui-dist
          path: internal/features/dashboard/ui/dist
          retention-days: 1

  # Static analysis and vulnerability scanning run in their OWN job, on their own
  # Go version. golangci-lint v2.12.2 requires Go 1.25, while this module targets
  # 1.22 and the build/test/cross-compile jobs must keep proving that. The
  # linter's toolchain is not the project's compatibility guarantee, and
  # conflating them would force a toolchain bump for a lint upgrade.
  #
  # `go install` at an exact tag rather than golangci-lint-action, whose major
  # version is coupled to the linter's (v6 targets 1.x, v8 targets 2.x) — one
  # pinned version instead of two that must agree, and it is the SAME command
  # CONTRIBUTING gives contributors, so "works locally, fails in CI" cannot come
  # from the runner.
  lint:
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
      # go:embed all:ui/dist means the dashboard package does not typecheck
      # without the built frontend, so reuse the artifact the test job produced.
      - uses: actions/download-artifact@v8
        with:
          name: dashboard-ui-dist
          path: internal/features/dashboard/ui/dist
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run
      # Reports only vulnerabilities REACHABLE from this code, so a finding here
      # is actionable rather than a CVE count to argue about.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # A stable aggregate named exactly `test`, because branch protection requires
  # a check by that NAME and a matrix renames its legs — `test` became
  # `test (ubuntu-latest, 1.22)` and `test (macos-latest, 1.25)`, so the
  # required check stopped reporting and this PR sat BLOCKED with every check
  # green. Left alone it would have blocked every future PR too.
  #
  # An aggregator keeps the rule working without editing repo settings, and
  # keeps working if either matrix grows another leg later. `needs` alone is
  # not enough: a failed, skipped, or cancelled dependency still lets an
  # `always()` job run, so every result is asserted explicitly. A matrix job's
  # result is success only when all of its legs succeed, which makes this gate
  # cover both test platforms and all six cross-compile targets.
  test:
    needs: [test-matrix, lint, clean-checkout, release-snapshot, cross-compile]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every CI job must have succeeded
        run: |
          echo "test-matrix result: ${{ needs.test-matrix.result }}"
          echo "lint result: ${{ needs.lint.result }}"
          echo "clean-checkout result: ${{ needs.clean-checkout.result }}"
          echo "release-snapshot result: ${{ needs.release-snapshot.result }}"
          echo "cross-compile result: ${{ needs.cross-compile.result }}"
          test "${{ needs.test-matrix.result }}" = "success"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.clean-checkout.result }}" = "success"
          test "${{ needs.release-snapshot.result }}" = "success"
          test "${{ needs.cross-compile.result }}" = "success"

  # Proves the clean-checkout path the README and CONTRIBUTING promise: build and
  # test with NO Node, no npm ci, no frontend build. The `test` job above always
  # builds the SPA first, so it can never catch a regression that makes the Go
  # build depend on a real dist — and `go:embed all:ui/dist` is exactly the kind
  # of directive that would (issue #437 item 3).
  #
  # Deliberately not the whole suite: this asks one question — does a fresh
  # clone compile and pass without the frontend toolchain — and the full matrix
  # above answers everything else.
  clean-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: no frontend build — the tree must stand on its own
        run: |
          test ! -f internal/features/dashboard/ui/dist/index.html \
            || (echo "a built SPA is committed; this job then proves nothing" && exit 1)
          go build ./cmd/dacli
          go test ./internal/features/dashboard/ ./internal/cli/

  # The RELEASE PATH, proven on every push without publishing anything.
  #
  # A release path that is only exercised when a tag is pushed is discovered to
  # be broken at the worst possible moment. This builds a snapshot and checks
  # what a consumer actually depends on: every supported platform present, an
  # SBOM per archive, checksums that verify, and — the acceptance criterion
  # issue #437 names — the binary the README's install commands yield actually
  # runs.
  #
  # Nothing here creates or pushes a tag. Publishing stays a deliberate human
  # act; this job is the evidence that when the maintainer does push one, the
  # path works.
  release-snapshot:
    needs: test-matrix
    runs-on: ubuntu-latest
    # A wedged job must FAIL, not hang. The first version of this job sat
    # in_progress for half an hour with no timeout while its run reported
    # success, leaving the PR permanently UNSTABLE on a check that would never
    # report. 15 minutes is ~3x the honest duration.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # goreleaser needs history for its version/changelog
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - uses: actions/download-artifact@v8
        with:
          name: dashboard-ui-dist
          path: internal/features/dashboard/ui/dist
      # PREBUILT binaries at PINNED versions, via the projects' own actions.
      #
      # The first version ran `go install …@latest` for both, which was wrong
      # twice over. `@latest` is the non-reproducibility this workflow pins
      # golangci-lint to avoid — I made the rule and then did not apply it
      # here. And building goreleaser and syft FROM SOURCE under Go 1.22 makes
      # the module resolver backtrack through releases looking for one that
      # supports it, which is what turned a 4-minute job into a stall.
      - uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
          version: "~> v2"
      - uses: anchore/sbom-action/download-syft@v0
      - name: verify release artifacts (snapshot, publishes nothing)
        run: ./scripts/verify-release-artifacts.sh

  cross-compile:
    needs: test-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      # Reuse the frontend build the `test` job already produced (go:embed
      # all:ui/dist) instead of re-running npm ci/build per matrix leg.
      - uses: actions/download-artifact@v8
        with:
          name: dashboard-ui-dist
          path: internal/features/dashboard/ui/dist
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./cmd/dacli
