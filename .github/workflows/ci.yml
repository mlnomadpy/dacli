name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Manual re-trigger for a branch whose pull_request event silently didn't fire
  # (dacli 263): `gh workflow run ci.yml --ref <branch>` forces a run against the
  # head SHA instead of hand-merging main to manufacture a synchronize event.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      # Build the dashboard SPA first: `go:embed all:ui/dist` (internal/features/
      # dashboard) embeds internal/features/dashboard/ui/dist/index.html, so the
      # frontend must be built before any go build/test/vet reads it, or the
      # binary would ship the legacy fallback page instead of the current SPA.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/features/dashboard/ui/package-lock.json
      - name: build frontend
        working-directory: internal/features/dashboard/ui
        run: |
          npm ci
          npm run build
      - name: test frontend
        working-directory: internal/features/dashboard/ui
        run: npm run test:unit
      - name: lint frontend
        working-directory: internal/features/dashboard/ui
        run: npm run lint
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      # The curated static-analysis gate. Its linter set and every deliberate
      # omission are argued in .golangci.yml itself, so a reviewer can see why
      # a check is or is not running without archaeology. Pinned to a version:
      # a floating "latest" turns an unrelated PR red the day upstream adds a
      # check, which is how teams learn to ignore the lint job.
      - name: lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          args: --timeout=10m
      # Dependency vulnerabilities, against the Go vulnerability database.
      # govulncheck reports only vulnerabilities REACHABLE from this code, so a
      # finding here is actionable rather than a CVE-count to argue about.
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.22"
      # -race and a coverage floor, because dacli's own `tdd` gate template
      # requires both of any project it governs and required neither of itself.
      #
      # Honest scope note: the race detector instruments GOROUTINES within one
      # process. dacli's sharpest concurrency risk is CROSS-process (parallel
      # agents read-modify-writing the same markdown through separate dacli
      # invocations), which -race cannot observe by construction. It is still
      # worth running — it is the cheapest guard available and covers the
      # in-process supervisor paths — but a green run here is not evidence that
      # concurrent agents are safe.
      - name: test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...
      - name: coverage floor
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "total coverage: ${pct}%"
          # A floor, not a target: it exists to catch a collapse (a package
          # losing its suite), so it sits below today's number rather than at
          # it. Raise it deliberately; never lower it to make a build pass.
          awk -v p="$pct" 'BEGIN { if (p+0 < 55) { printf "coverage %.1f%% is below the 55%% floor\n", p; exit 1 } }'
      - name: build
        run: go build ./cmd/dacli
      # Share this one build with cross-compile below instead of every matrix
      # leg running its own npm ci + npm run build.
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-ui-dist
          path: internal/features/dashboard/ui/dist
          retention-days: 1

  cross-compile:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      # Reuse the frontend build the `test` job already produced (go:embed
      # all:ui/dist) instead of re-running npm ci/build per matrix leg.
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-ui-dist
          path: internal/features/dashboard/ui/dist
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./cmd/dacli
