# Dependency updates.
#
# Grouped and monthly on purpose. dacli's own loop opens pull requests, and a
# stream of one-PR-per-bump from a bot competes with them for the same review
# attention and the same CI minutes — the merge queue this repo cares about is
# the one carrying actual work. Grouping turns a dozen PRs into one, and the
# security ecosystem still gets same-day alerts through govulncheck in CI.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 3

  # The dashboard SPA. `go:embed all:ui/dist` means a broken frontend build
  # breaks the Go build, so these bumps are not cosmetic.
  - package-ecosystem: npm
    directory: /internal/features/dashboard/ui
    schedule:
      interval: monthly
    groups:
      # Dev tooling churns far more than runtime deps and carries less risk;
      # splitting them keeps a Vite bump from sitting behind a Vue review.
      dev-dependencies:
        dependency-type: development
      runtime-dependencies:
        dependency-type: production
    ignore:
      # TypeScript 7 is the native rewrite, and its package `exports` map drops
      # every `./lib/*` entry — only `./lib/version.cjs` and `./unstable/*`
      # remain. vue-tsc resolves `typescript/lib/tsc.js`, so it dies with
      # ERR_PACKAGE_PATH_NOT_EXPORTED the moment TS 7 is installed, which is
      # what turned the dev-dependencies group red and held eleven unrelated
      # bumps behind one incompatible package.
      #
      # vue-tsc declares `peerDependencies: {typescript: ">=5.0.0"}`, so npm
      # raises nothing: the range admits 7 and the package does not work with
      # it. The peer metadata is the thing that is wrong, and we cannot fix it
      # from here — so hold the major back until vue-tsc ships support, rather
      # than let an unsatisfiable bump keep re-proposing itself every month.
      #
      # Minor and patch TypeScript updates still flow. Drop this entry once
      # vue-tsc supports 7; it is a workaround for another package's bug, not a
      # position on TypeScript.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(ui)"
    open-pull-requests-limit: 3

  # The workflows themselves. A pinned action that never updates is how a
  # supply-chain advisory goes unnoticed for a year.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(ci)"
